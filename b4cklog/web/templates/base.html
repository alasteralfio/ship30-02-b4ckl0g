<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}B4CKL0G{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
      color: #1b1e23;
      line-height: 1.5;
    }
    header { margin-bottom: 2rem; }
    header a { color: inherit; text-decoration: none; }
    header h1 { font-size: 1.1rem; letter-spacing: 0.04em; margin: 0; }
    h2 { font-size: 1.2rem; margin-top: 2.25rem; }
    .subtle { color: #5b616b; }
    .banner {
      background: #fff6e5;
      border: 1px solid #e8cf9c;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
    }
    .placement-picture { margin: 1.5rem 0; }
    .rec-list { list-style: none; padding: 0; margin: 0; }
    .rec {
      border-bottom: 1px solid #e5e7eb;
      padding: 0.9rem 0;
    }
    .rec:first-child { border-top: 1px solid #e5e7eb; }
    .rec-head { display: flex; justify-content: space-between; gap: 1rem; }
    .rec-name { font-weight: 600; }
    .rec-score { color: #5b616b; font-variant-numeric: tabular-nums; }
    .rec-detail { color: #5b616b; font-size: 0.92rem; margin-top: 0.2rem; }
    .caveat { margin-top: 0.35rem; font-size: 0.92rem; }
    form input[type="text"] {
      font-size: 1rem;
      padding: 0.5rem 0.65rem;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }
    form button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      margin-left: 0.4rem;
    }
  </style>
</head>
<body>
  <header><a href="/"><h1>B4CKL0G</h1></a></header>
  {% block content %}{% endblock %}
</body>
</html>
